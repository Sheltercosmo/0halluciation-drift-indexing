name: Replay bounded evaluation
on:
  push:
    paths:
      - "evals/results/bounded-v1/**"
      - "scripts/replay_bounded_results.py"
      - "scripts/fetch_bounded_data.py"
      - "evals/requirements-bounded.txt"
      - ".github/workflows/replay-bounded.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r evals/requirements-bounded.txt
      - run: python scripts/fetch_bounded_data.py
      - run: python evals/results/bounded-v1/source/scripts/bounded_eval.py prepare --data output/frontier-data --output output/bounded-replay
      - run: python scripts/replay_bounded_results.py
